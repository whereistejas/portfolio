[build]
target = "index.html"
dist = "dist"

[serve]
port = 8080
open = false

[[hooks]]
stage = "pre_build"
command = "bun"
command_arguments = ["run", "css"]

# Pages has no rewrite rules, so every route needs a real file on disk.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/emit-routes.sh"]
