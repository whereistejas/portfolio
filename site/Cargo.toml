[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
# Deliberately no leptos feature here. `portfolio` selects `csr`, `prerender` selects
# `ssr`; they are separate build roots, so the two never unify. Do not use
# `cargo --workspace`, which would turn both on at once.
leptos = "0.8"
serde = { version = "1", features = ["derive"] }
